[package]
name = "linkr-tui"
version = "1.0.0"
edition = "2021"
description = "Cross-platform host CLI and TUI for the Linkr Bee wireless serial bridge"
license = "Apache-2.0"
repository = "https://github.com/radxa/linkr-bee"
authors = ["Linkr Bee contributors"]

[[bin]]
name = "linkr"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
unicode-width = "0.2.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
