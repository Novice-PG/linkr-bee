description: |
  Radxa Linkr Bee X1.0 addressable RGB status LED.

  The LED is an Everlight EY-PB1615RGBIC-010F, a WS2812-compatible single-wire
  part. The application drives the protocol itself (see src/linkr_rgb_led.c)
  because no in-tree LED strip driver targets the ESP32-C3; this binding only
  describes the GPIO and the pixel layout.

  Board caveat: on rev X1.00 the schematic places C31 (100 nF) on this data
  line. That is incompatible with the ~800 kHz waveform and must be removed or
  left unpopulated on the PCB.

compatible: "radxa,linkr-ws2812"

include: [base.yaml]

properties:
  data-gpios:
    type: phandle-array
    required: true
    description: |
      GPIO carrying the single-wire data stream.

  chain-length:
    type: int
    default: 1
    description: |
      Number of pixels in the chain. The board has one.

  color-order:
    type: string
    default: "GRB"
    enum: ["RGB", "GRB", "BRG", "BGR", "RBG", "GBR"]
    description: |
      Byte order expected by the LED controller. WS2812-compatible parts
      (including the EY-PB1615RGBIC) take GRB.
