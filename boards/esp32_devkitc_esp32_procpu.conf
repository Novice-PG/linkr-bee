# ESP32-DevKitC (Xtensa dual-core) board-specific overrides.
# prj.conf defaults are tuned for ESP32-C3; Xtensa ESP32 has different DRAM
# layout (dram0 + dram1) and needs tighter buffer limits.

# Disable WebDAV to save ~12KB noinit (LOG_RING + UPLOAD_STACK).
CONFIG_LINKR_BLE_BRIDGE_WEBDAV=n

# BT ACL TX buffers. This used to be 4 to save DRAM1, but the ESP32 controller
# reports 10 available ACL packets, so Zephyr warned on every boot
# ("<wrn> bt_hci_core: Num of Controller's ACL packets != ACL bt_conn_tx
# contexts (10 != 4)"). Match the controller at 10; prj.conf ships 12.
CONFIG_BT_BUF_ACL_TX_COUNT=10

# ── M4: let the peripheral ask for a 7.5–15 ms connection interval ──────────
# prj.conf:22 ships CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n (Zephyr's own
# default is y), so this device never negotiates and the interval is whatever
# the central picked — measured steady at 37.5 ms. That interval is the
# per-ATT-write round trip for the reliable upstream path: BACKLOG A4 timed a
# write-with-response at a median of 178 ms (min 133 / max 223) = 4.75 of those
# intervals, i.e. 1.0-1.4 KiB/s upstream. Turning the auto-update back on makes
# conn.c's deferred_work() (conn.c:2297, runs 5 s after each connect, up to 3
# retries) emit a LE Connection Parameter Request carrying the values below.
#
# 6/12 are in 1.25 ms units = 7.5-15 ms, the Kconfig floor (range starts at 6).
# LATENCY is left at its default 0 — a non-zero latency multiplies this same
# round trip by (1+latency), which is the opposite of the change. TIMEOUT stays
# at the default 42 = 420 ms, valid for the new range (needs > max_interval*2
# = 30 ms; Kconfig.gatt:56).
#
# Acceptance risk to watch, not a reason to skip it: linkr_uart_write() has no
# retry — main.c:1445 refuses the whole write with -ENOMEM and counts it in
# "@info queue dropped" when the 16-deep upstream queue is full. A faster air
# rate therefore only pays off if UART (11520 B/s at 115200) keeps up, so the
# post-flash check must include a bulk upstream run and a @i? dropped= compare.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# Report heap headroom in "@i?" ("@info heap free=… used=… peak=…"). The system
# heap is DRAM0's largest single allocation and had no runtime report, so
# sizing HEAP_MEM_POOL_SIZE was guesswork. Costs code size only, no RAM.
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# ESP32 WiFi pools — conservative to fit DRAM0.
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=5
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_RX_MGMT_BUF_NUM_DEF=3
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=6

# ── The cap that actually held LAN concurrency at one client (BACKLOG M10) ───
# Not a cut — 4 is Zephyr's own `default 4` and the C3 build ships it too — but
# raising WS_BRIDGE_MAX_CLIENTS to 2 on its own does nothing, and the failure is
# silent from the app's point of view. Two places in Zephyr clamp on it:
#
#   tcp.c:3780        if (backlog > CONFIG_NET_MAX_CONN) backlog = CONFIG_NET_MAX_CONN;
#   connection.c:404  conn_get_unused() == NULL -> -ENOENT,
#                     "Not enough connection contexts. Consider increasing CONFIG_NET_MAX_CONN."
#
# A raw TCP probe made this concrete: exactly one connection to :80 succeeded,
# the second was refused with ECONNREFUSED at the SYN — before any HTTP slot was
# ever considered — and closing the first immediately freed the slot again. That
# is 4 conn entries minus listen + WiFi/DNS UDP bindings leaving room for one.
# 8 is Zephyr's `default 8 if NET_IPV6 && NET_IPV4`. Cost: conns[] is 176 B for
# 4 entries (44 B each) in DRAM0, so 4->8 is +176 B.
CONFIG_NET_MAX_CONN=8

# Thread stacks — reduced for the DRAM1 noinit budget (only 6772B free once
# the three drop-point buffers were restored). Restored where stack risk
# outweighed cost: MAIN and BT_TX_PROCESSOR back to prj.conf's 4096/2048.
# SYSTEM_WORKQUEUE stays 4096 (prj.conf wants 8192) because +4096 would not
# fit alongside these two; BT_RX / WIFI_CONNECT stay at their reduced 2048.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_LINKR_BLE_BRIDGE_WIFI_CONNECT_STACK=2048

# ── Not a cut: M3's one measured reboot risk (BACKLOG M3/M10) ────────────────
# BT long workqueue 1400 -> 2048. 1400 is Zephyr's default and C3 uses it too,
# but M3 measured it at 83% used / 236 B unused, holding steady across all 12
# reports while burning 41% CPU on real BLE traffic. Unlike the logging stack
# (analyzer artifact, see M3), this number does not move with load, so 236 B is
# what is left for a deeper nest in bt_conn/bt_adv — an overflow here reboots
# the device mid-connection. +648 B DRAM1 (bt_lw_stack_area 1408 -> 2056).
# The other two stacks M3 flagged are deliberately NOT grown: logging's 91% is
# self-inflicted by LOG_PRINTK routing analyzer reports through it (28% before
# the first report) and ble_to_uart's 1024 is hardcoded in src/main.c:1780.
CONFIG_BT_LONG_WQ_STACK_SIZE=2048

# UART RX ring: restored to the C3 baseline 16384 (~1.44 s at 115200, up from
# 8192 / ~720 ms). This is the buffer that holds what the user actually
# watches — Kconfig's own help: "Larger values reduce dropped boot-log bytes
# when the SBC emits a burst faster than BLE can transmit." The earlier note
# about it living in DRAM1 noinit was stale: nm puts uart_rx_storage at a
# DRAM0 address (0x3ffc…), and DRAM0 had 14288 B free after M1/M2, so +8192 B
# leaves 6096 B.
# Trade-off recorded in BACKLOG M6/M9: LOG_BUFFER_SIZE 1024→8192 (+7168 DRAM0)
# cannot ride along — 8192+7168 = 15360 > 14288. The ring won because the
# SBC serial stream is the product; the log buffer only loses firmware
# diagnostics (measured: 27 records per 15 s at 1024).
CONFIG_LINKR_BLE_BRIDGE_UART_RX_BUFFER_SIZE=16384

# Upstream packet queue (BLE/WS RX -> UART): Kconfig default 8 overruns when
# UART is busy; 16 costs +1968B (246B per bridge_packet) in DRAM1 noinit.
CONFIG_LINKR_BLE_BRIDGE_BLE_TO_UART_QUEUE_DEPTH=16

# BACKLOG M5: the bridge follows the SBC instead of making it match us. The
# board ships UART_BAUD_RATE=115200 while Kconfig's own help lists 1500000 /
# 921600 / 1000000 as typical SBC console rates, so a console swap is a
# mismatch waiting to happen. Hardware does the measuring (UART_AUTOBAUD_EN
# stores min(lowpulse, highpulse) on RXD), software decides when and what to
# apply. Off by default; one line to take back.
CONFIG_LINKR_BLE_BRIDGE_UART_AUTOBAUD=y

# Log level: WARN, not the ERR-only setting this board shipped with while it
# was memory constrained. Log strings live in flash (irom/drom were 96% free)
# and the deferred log buffer stays at its existing size, so this costs no
# DRAM — but it makes the upstream drop report (LOG_WRN in linkr_uart_write)
# visible again instead of silent.
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_WIFI_LOG_LEVEL_ERR=y

# Allow chip revision 1 (unsupported by Espressif but functional).
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y

# Disable GPIO pairing button requirement (no physical button available).
CONFIG_LINKR_BLE_BRIDGE_PAIRING_GPIO_AUTH=n

# Persist WiFi credentials and BLE bonds across reboots.
CONFIG_LINKR_BLE_BRIDGE_PERSIST_CREDENTIALS=y

# Bypass ESP32 WiFi/BT heap auto-sum check.
# System heap stays at 52000: raising it to 65536 bought 13.5KB of speculative
# runtime slack (no OOM evidence either way) but it was DRAM0 that had to pay
# for relocating the queue and ring stores out of DRAM1, and DRAM1 was the
# region at 98% with every pending restoration (WiFi pools, system workqueue,
# ACL count) waiting on it. Re-measure runtime heap usage before raising this.
CONFIG_HEAP_MEM_POOL_SIZE=52000
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y

# HTTP server — two concurrent clients, not one. This was cut to 1 to fit
# DRAM0, and M3/BACKLOG M10 established that it is a HARD limit rather than a
# queue: Zephyr's http server hands each accepted socket a slot from a static
# clients[] array and, when the slots run out, does
#
#     if (!found_slot) { LOG_DBG("No free slot found."); zsock_close(new_socket); }
#
# (http_server_core.c, in the accept branch). So a second browser tab, or the
# Rust CLI while the web frontend is open, is accepted and then instantly
# dropped. HTTP_SERVER_MAX_CLIENTS and WEBSOCKET_MAX_CONTEXTS both default to
# this value (Kconfig:417/420), so one line moves all three — no separate knobs.
#
# Cost taken off the ELF before the change: clients[] 2160 (holds the per-client
# tx_buf), contexts[] 888, server_ctx 1392 (its clients[] and fds[] both grow),
# ws_handler_threads 160 => +5580 DRAM0, plus ws_client_stacks 4096 -> 8192 in
# DRAM1. See BACKLOG M10 for the measured post-build margins. Consequence to
# keep in mind: DRAM0 is now spent, so LOG_BUFFER_SIZE 1024 -> 8192 (+7168) —
# the one cut with hard evidence of loss (27 records / 15 s) — still cannot
# land here and would have to reclaim first.
CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE_MAX_CLIENTS=2
# Per-client WS thread stack: this Kconfig's own default is 4096 and the
# board used to halve it to 2048 for DRAM1; restored to 4096 (+2048 DRAM1)
# because a stack overflow here reboots the device.
CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE_STACK=4096
# Per-client TX ring: Kconfig default 2048 (downlink window ~178ms at
# 115200); the 1024 setting halved it. clients[] lives in DRAM0 .bss, which
# had 27896B free at baseline, so this costs +1024B there.
CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE_CLIENT_BUFFER_SIZE=2048
CONFIG_LINKR_BLE_BRIDGE_MGMT_TX_QUEUE_DEPTH=16
# Management request stack: back to the C3 baseline / Kconfig default 4096.
# @i? / @s? / @w? / @d? all run on this thread; 2048 was a DRAM1 cut and M3
# never measured it (the 1024 B log buffer truncated the watermark report), so
# restore on the side of safety: a stack overflow here would take out command
# handling. +2048 DRAM1 -> 8000 B free.
CONFIG_LINKR_BLE_BRIDGE_MGMT_REQUEST_STACK=4096
