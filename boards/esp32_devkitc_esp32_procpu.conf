# ESP32-DevKitC (Xtensa dual-core) board-specific overrides.
# prj.conf defaults are tuned for ESP32-C3; Xtensa ESP32 has different DRAM
# layout (dram0 + dram1) and needs tighter buffer limits.

# Disable WebDAV to save ~12KB noinit (LOG_RING + UPLOAD_STACK).
CONFIG_LINKR_BLE_BRIDGE_WEBDAV=n

# Reduce BT ACL buffers for single-connection use.
#
# The controller reports 10 available ACL packets, and Zephyr's
# CHECK_NUM_OF_ACL_PKTS() would LOG_WRN about the mismatch — but this board logs
# at ERR only (CONFIG_BT_HCI_CORE_LOG_LEVEL=1), so it never reaches the
# console, while the six extra contexts do reach dram1: raising this to 10 was
# measured at 90.59% -> 94.38% of dram1 (89052 -> 92784 B of 96 KB). The single
# connection these buffers serve does not need them, so the DRAM wins.
CONFIG_BT_BUF_ACL_TX_COUNT=4

# ── Let the peripheral ask for a 7.5–15 ms connection interval ───────────────
# prj.conf ships CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n, and although Zephyr's
# own default is y, that n wins: this device never negotiates and the interval
# is whatever the central picked, measured steady at 37.5 ms. That interval is
# the per-ATT-write round trip of the reliable upstream path — a
# write-with-response timed at a median of 178 ms (min 133 / max 223) is 4.75
# of them, i.e. 1.0-1.4 KiB/s upstream. Turning the auto-update back on makes
# conn.c's deferred_work emit a LE Connection Parameter Request carrying the
# values below, a few seconds after each connect with up to three retries.
#
# 6/12 are in 1.25 ms units = 7.5-15 ms, and 6 is the Kconfig floor. LATENCY
# stays at its default 0: a non-zero latency multiplies that same round trip by
# (1 + latency), which is the opposite of the change being made here.
#
# Watched, not assumed: a faster air rate only pays off while UART (11520 B/s
# at 115200) keeps up, and the transport-to-UART queue has no retry — a full
# one refuses the write and counts it in "@info queue dropped". Check a bulk
# upstream run and an "@i?" dropped= before and after flashing this.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# ESP32 WiFi pools — conservative to fit DRAM0.
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=5
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_RX_MGMT_BUF_NUM_DEF=3
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=6

# Thread stacks — reduced for DRAM1 noinit budget.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=1024
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_LINKR_BLE_BRIDGE_WIFI_CONNECT_STACK=2048

# UART RX ring: 16KB default is too large for DRAM1 noinit; 4KB suffices
# at 115200 baud (~360ms buffer).
CONFIG_LINKR_BLE_BRIDGE_UART_RX_BUFFER_SIZE=4096

# Log level: keep quiet for production.
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_WIFI_LOG_LEVEL_ERR=y

# Allow chip revision 1 (unsupported by Espressif but functional).
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y

# Disable GPIO pairing button requirement (no physical button available).
CONFIG_LINKR_BLE_BRIDGE_PAIRING_GPIO_AUTH=n

# Persist WiFi credentials and BLE bonds across reboots.
CONFIG_LINKR_BLE_BRIDGE_PERSIST_CREDENTIALS=y

# Bypass ESP32 WiFi/BT heap auto-sum check.
CONFIG_HEAP_MEM_POOL_SIZE=52000
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y

# HTTP server — single client, smaller stack.
CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE_MAX_CLIENTS=1
CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE_STACK=2048
CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE_CLIENT_BUFFER_SIZE=1024
CONFIG_LINKR_BLE_BRIDGE_MGMT_TX_QUEUE_DEPTH=16
CONFIG_LINKR_BLE_BRIDGE_MGMT_REQUEST_STACK=2048
