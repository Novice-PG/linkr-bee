# ESP32-DevKitC (Xtensa dual-core) board-specific overrides.
# prj.conf defaults are tuned for ESP32-C3; Xtensa ESP32 has different DRAM
# layout (dram0 + dram1) and needs tighter buffer limits.

# Disable WebDAV to save ~12KB noinit (LOG_RING + UPLOAD_STACK).
CONFIG_LINKR_BLE_BRIDGE_WEBDAV=n

# Reduce BT ACL buffers for single-connection use.
CONFIG_BT_BUF_ACL_TX_COUNT=4

# ESP32 WiFi pools — conservative to fit DRAM0.
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=5
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_RX_MGMT_BUF_NUM_DEF=3
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=6

# Thread stacks — reduced for DRAM1 noinit budget.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=1024
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_LINKR_BLE_BRIDGE_WIFI_CONNECT_STACK=2048

# UART RX ring: 16KB default is too large for DRAM1 noinit; 4KB suffices
# at 115200 baud (~360ms buffer).
CONFIG_LINKR_BLE_BRIDGE_UART_RX_BUFFER_SIZE=4096

# Log level: keep quiet for production.
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_WIFI_LOG_LEVEL_ERR=y

# Allow chip revision 1 (unsupported by Espressif but functional).
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y

# Disable GPIO pairing button requirement (no physical button available).
CONFIG_LINKR_BLE_BRIDGE_PAIRING_GPIO_AUTH=n

# Persist WiFi credentials and BLE bonds across reboots.
CONFIG_LINKR_BLE_BRIDGE_PERSIST_CREDENTIALS=y

# Bypass ESP32 WiFi/BT heap auto-sum check.
CONFIG_HEAP_MEM_POOL_SIZE=52000
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y

# HTTP server — single client, smaller stack.
CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE_MAX_CLIENTS=1
CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE_STACK=2048
CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE_CLIENT_BUFFER_SIZE=1024
CONFIG_LINKR_BLE_BRIDGE_MGMT_TX_QUEUE_DEPTH=16
CONFIG_LINKR_BLE_BRIDGE_MGMT_REQUEST_STACK=2048
