name: Deploy the web terminal to GitHub Pages

# The plain web terminal (web/) is a self-contained static site: no backend, no
# bundler, all asset references relative. Publishing it is therefore a copy plus
# one generated switch: tools/build_pages.sh copies web/ and turns the LAN
# bridge off, because an https page may not open ws:// and the device serves no
# TLS. The vendored assistant bundle committed under web/vendor/agent is not
# rebuilt here -- what is published is what the regression suite ran against,
# with that single switch flipped.
#
# BLE (Web Bluetooth) needs a secure context, which Pages provides. The LAN
# WebSocket bridge is hidden entirely in this variant; LAN connections keep
# using a locally served copy (tools/serve_web.sh).
#
# Requires Settings -> Pages -> Source: "GitHub Actions" once.

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "tools/build_pages.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deployments are not worth racing: a cancelled deploy can leave the site
# half-updated, and the site changes at most a few times a day.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the plain web terminal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble the Pages variant
        run: sh tools/build_pages.sh build-pages

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
