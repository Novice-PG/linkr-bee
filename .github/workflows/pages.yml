name: Deploy the web terminal and the firmware flasher to GitHub Pages

# Fork-only deployment.
#
# The published site is this branch's `web/`: the Web terminal at the root and
# the browser flasher at `flash.html`, both built from the fork's own tree. The
# workflow checks the branch out explicitly, so a push to main (which carries a
# different Pages policy) can never replace the deployed site, and a release
# publication still refreshes the staged firmware automatically.
#
# Requires Settings -> Pages -> Source: "GitHub Actions" once.

on:
  push:
    branches:
      - fork/web-flasher
    paths:
      - "web/**"
      - "tools/build_firmware_manifest.py"
      - ".github/workflows/pages.yml"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the firmware flasher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the flasher branch
        uses: actions/checkout@v4
        with:
          ref: fork/web-flasher

      # Publish the newest released firmware beside the page. The flasher
      # fetches these same-origin files rather than cross-origin release
      # assets. Without a release the page still deploys and its runtime
      # fallback reads the latest release from the API.
      - name: Stage the latest released firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .firmware-release
          if gh release download \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern '*firmware-*.zip' \
              --dir .firmware-release; then
            tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
            python3 tools/build_firmware_manifest.py \
              --source .firmware-release \
              --output web/firmware \
              --tag "${tag}" \
              --repo "${GITHUB_REPOSITORY}"
          else
            echo "No released firmware yet; publishing without a staged manifest."
            rm -rf .firmware-release
          fi

      # Jekyll is skipped for artifacts, but an empty .nojekyll also keeps a
      # future switch to branch-based publishing from silently dropping paths.
      - name: Mark the site as plain static files
        run: touch web/.nojekyll

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
