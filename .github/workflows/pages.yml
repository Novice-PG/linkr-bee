name: Deploy the web terminal to GitHub Pages

# The plain web terminal (web/) is a self-contained static site: no backend, no
# build step, all asset references relative. Publishing it is therefore a copy,
# and the vendored assistant bundle committed under web/vendor/agent is the
# artifact -- it is not rebuilt here, so what is published is exactly what the
# regression suite ran against.
#
# The same deployment also stages the firmware from the newest GitHub release
# under web/firmware/. The browser flasher fetches those files from this origin
# rather than github.com: release assets redirect to a storage host that does
# not answer a cross-origin fetch, and a flasher should not depend on a CORS
# proxy. A release event redeploys the site, so the flasher follows the latest
# release without a source commit.
#
# BLE (Web Bluetooth) needs a secure context, which Pages provides. The LAN
# WebSocket bridge works from here too, but with a warning: an https page that
# opens ws:// is mixed content, and Chromium allows it while marking it
# deprecated ("Insecure access to this endpoint is deprecated"). Measured on
# 2026-09-29 against a ws:// endpoint on a 192.168 address from this exact
# origin: the connection opened, only the warning was printed. The bridge is
# therefore left available; a locally served copy (tools/serve_web.sh) remains
# the way to run it without the warning, and to reach a device when a browser
# does enforce the deprecation.
#
# Requires Settings -> Pages -> Source: "GitHub Actions" once.

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
      - "tools/build_firmware_manifest.py"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deployments are not worth racing: a cancelled deploy can leave the site
# half-updated, and the site changes at most a few times a day. A release is the
# important exception: it must be allowed to replace an older firmware bundle.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the plain web terminal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Publish the newest released firmware beside the page. If the project
      # has not published a release yet, the page still deploys and its
      # runtime fallback can read the latest release from the API.
      - name: Stage the latest released firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .firmware-release
          if gh release download \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern '*firmware-*.zip' \
              --dir .firmware-release; then
            tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
            python3 tools/build_firmware_manifest.py \
              --source .firmware-release \
              --output web/firmware \
              --tag "${tag}" \
              --repo "${GITHUB_REPOSITORY}"
          else
            echo "No released firmware yet; publishing without a staged manifest."
            rm -rf .firmware-release
          fi

      # Jekyll is skipped for artifacts, but an empty .nojekyll also keeps a
      # future switch to branch-based publishing from silently dropping paths.
      - name: Mark the site as plain static files
        run: touch web/.nojekyll

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
