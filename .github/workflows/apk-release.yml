name: Refresh the Android APK on a release

# A release asset is a snapshot of the tagged commit: the APK wraps the Web
# terminal that the same commit built, so a Web change only reaches phones
# through a new build. This dispatch rebuilds the APK from the current ref and
# replaces it on an existing release.
#
# The release also carries SHA256SUMS and release-manifest.json, which name the
# hash of every asset. Replacing one file without them would leave the release
# advertising a hash that no longer matches, so both are patched from the
# rebuilt APK before they are uploaded back.
#
# Only the APK is replaced; the firmware, Web package and desktop archives of
# the release keep the files they were published with.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to refresh"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  # The APK job already knows how to build the Web assets, sync them into the
  # Capacitor project and check the version the APK reports.
  build:
    uses: ./.github/workflows/build.yml

  refresh:
    name: Replace the APK and its checksums
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect the APK built by this run
        uses: actions/download-artifact@v4
        with:
          name: linkr-bee-apk
          path: apk

      - name: Read the checksum files the release carries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p meta
          gh release download "$TAG" \
            --pattern 'SHA256SUMS' \
            --pattern 'release-manifest.json' \
            --dir meta

      - name: Patch the manifest and the checksums
        env:
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          apk = next(Path("apk").glob("*.apk"))
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          size = apk.stat().st_size

          manifest_path = Path("meta/release-manifest.json")
          manifest = json.loads(manifest_path.read_text())
          replaced = 0
          for asset in manifest["assets"]:
              if asset["name"] == apk.name:
                  asset["size"] = size
                  asset["sha256"] = digest
                  asset["build_run"] = int(os.environ["RUN_ID"])
                  replaced += 1
          if replaced != 1:
              raise SystemExit(
                  f"the manifest does not carry exactly one {apk.name} entry "
                  f"(found {replaced}); refusing to publish a hash nobody else has"
              )
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")

          # The release's SHA256SUMS names every asset in sorted order, the same
          # order tools/assemble_release.py writes it in.
          sums = "".join(
              f"{asset['sha256']}  {asset['name']}\n"
              for asset in sorted(manifest["assets"], key=lambda item: item["name"])
          )
          Path("meta/SHA256SUMS").write_text(sums)
          print(f"{apk.name}: {size} bytes, {digest}")
          PY

      - name: Replace the asset and upload the updated metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" apk/*.apk meta/SHA256SUMS meta/release-manifest.json --clobber

      - name: Read the release back
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.size)\t\(.name)"' | sort -k2
