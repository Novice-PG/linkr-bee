name: Host terminal (linkr-tui)

# The host client is a Rust crate under tools/linkr-tui. It has its own gates —
# one of which cross-checks every target a Linux runner can compile for — and
# its own release artifacts, so
# it is a workflow of its own rather than jobs bolted onto the firmware one:
# a TUI change should not spin up five Zephyr toolchains, and a firmware change
# should not rebuild the host's fourteen archives.
#
# Tag a release with `linkr-tui-v<version>`; the archives are attached to it.
# The tag is namespaced so it cannot collide with the firmware's `v*` releases.

on:
  push:
    # Every branch, filtered to the crate's own files: a TUI change runs these
    # gates wherever it is pushed, a firmware-only change does not. Path filters
    # are not evaluated for tag pushes, which is what a release wants — the tag
    # builds whatever it points at.
    branches:
      - "**"
    tags:
      - "linkr-tui-v*"
    paths:
      - "tools/linkr-tui/**"
      - ".github/workflows/linkr-tui.yml"
  pull_request:
    paths:
      - "tools/linkr-tui/**"
      - ".github/workflows/linkr-tui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkr-tui-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # `cargo check` links nothing, but libdbus-sys still asks pkg-config for the
  # target's flags — on a cross target that question must be allowed to cross.
  PKG_CONFIG_ALLOW_CROSS: "1"

defaults:
  run:
    # Commands default to the crate, the way they are run by hand — the one
    # firmware step says so when it reaches up to the repository root instead.
    working-directory: tools/linkr-tui

jobs:
  gates:
    name: Gates (fmt · clippy · test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # rust-toolchain.toml names the channel, the components and the seven
      # targets, so there is nothing to install here beyond honouring it.
      - name: Show the toolchain
        run: |
          set -euo pipefail
          cargo --version
          rustc --version

      # What the tests need before they run, so the gate measures the suite
      # rather than the runner: every test binary links the host's libdbus,
      # and the completion tests are written for fish and zsh — they skip
      # themselves where a shell is absent, which hides coverage quietly.
      - name: Install the test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y libdbus-1-dev pkg-config fish zsh

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/linkr-tui -> target

      - name: Style
        run: cargo fmt --check

      - name: Lints, warnings are errors
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests, headless
        # `--locked`: Cargo.lock is committed, and a gate that silently updates
        # it would be testing a dependency set nobody reviewed.
        run: cargo test --locked

      # The second face of the same program. The `cli/` archives are built with
      # the interface feature off, which is where a bin notices what the
      # interface was holding up — so this face gets its own lint-and-test pass
      # rather than being trusted because the other one is green.
      - name: Lints of the CLI build, warnings are errors
        run: cargo clippy --all-targets --locked --no-default-features --features cli -- -D warnings

      - name: Tests of the CLI build
        run: cargo test --locked --no-default-features --features cli

      - name: Firmware rate arithmetic
        # No Zephyr, no toolchain: src/uart_autobaud_math.h is plain integers,
        # and this is the only part of the firmware a host compiler can judge.
        # The test lives with the firmware, not in the crate, so this step —
        # and only this step — runs from the repository root.
        working-directory: .
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -o /tmp/test_uart_autobaud tests/test_uart_autobaud.c
          /tmp/test_uart_autobaud

  targets:
    name: Cross targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The C in the dependency tree (aws-lc-sys) is compiled for the target,
      # check or no check, so the cross C compilers are what this job needs.
      # The libdbus is only for the probe — a check links nothing, but
      # libdbus-sys still asks pkg-config for the Linux targets' flags.
      - name: Install the cross compilers
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64 \
                                  libdbus-1-dev pkg-config

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/linkr-tui -> target
          key: targets

      # The fourth gate: the targets a Linux runner can genuinely compile
      # for. Windows MSVC and the Apple targets want SDKs that cannot be
      # installed here; they are built for real by the package matrix on
      # their own systems — a stronger claim than a check. This job is the
      # fast one, not the only one.
      - name: Check the cross targets
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                        x86_64-pc-windows-gnu; do
            echo "::group::$target"
            cargo check --locked --all-targets --target "$target"
            cargo check --locked --all-targets --no-default-features --features cli \
              --target "$target"
            echo "::endgroup::"
          done

  package:
    name: Package ${{ matrix.target }}
    needs: [gates]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux on x86-64: the host this is developed on, so it is also the
          # one whose archive is *run* before it is uploaded. It links the
          # host's own libdbus, installed with the cross tools below.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            native: true
            apt: libdbus-1-dev
          # Linux on ARM: needs a cross linker, installed below.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            apt: gcc-aarch64-linux-gnu
            linker_var: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
            linker: aarch64-linux-gnu-gcc
          # Windows, GNU ABI: built on Linux, where mingw-w64 is one apt away.
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            apt: gcc-mingw-w64-x86-64
            linker_var: CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER
            linker: x86_64-w64-mingw32-gcc
          # Windows, MSVC ABI, on Windows: the ARM64 tools ship with the
          # Visual Studio build the runner has.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            native: true
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          # macOS on both architectures. `macos-latest` is ARM, and Apple's
          # clang links either, so the x86-64 build is a target swap and no more.
          - os: macos-latest
            target: aarch64-apple-darwin
            native: true
          - os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install what the link needs
        if: matrix.apt != ''
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y "${{ matrix.apt }}"
          # The arm64 leg links the arm64 libdbus, which lives on the ports
          # archive — the runner's own sources only carry amd64. Extract it the
          # way a laptop cross build does, then aim the probe at the tree.
          if [ "${{ matrix.target }}" = aarch64-unknown-linux-gnu ]; then
            stage=/tmp/arm64-dbus
            mkdir -p "$stage"
            fetch() {
              local dir=$1 pattern=$2 deb
              deb=$(curl -fsSL "http://ports.ubuntu.com/ubuntu-ports/pool/main/$dir/" |
                grep -oE "$pattern" | sort -V | tail -1)
              echo "fetching $deb"
              curl -fsSL -o "/tmp/$deb" \
                "http://ports.ubuntu.com/ubuntu-ports/pool/main/$dir/$deb"
              dpkg-deb -x "/tmp/$deb" "$stage"
            }
            fetch d/dbus 'libdbus-1-dev_[^"]*_arm64\.deb'
            # The dev package's `libdbus-1.so` points at the runtime library,
            # which only the runtime package ships. With it missing the symlink
            # dangles, `-ldbus-1` silently falls back to the static archive in
            # the dev tree, and that archive wants systemd's `sd_listen_fds` at
            # link time — a symbol no link line here asks for.
            fetch d/dbus 'libdbus-1-3_[^"]*_arm64\.deb'
            fetch s/systemd 'libsystemd-dev_[^"]*_arm64\.deb'
            fetch s/systemd 'libsystemd0_[^"]*_arm64\.deb'
            pc="$stage/usr/lib/aarch64-linux-gnu/pkgconfig"
            sed -i -E \
              "s#^(prefix|exec_prefix|libdir|includedir)=/usr#\1=$stage/usr#" \
              "$pc/dbus-1.pc" "$pc/libsystemd.pc"
            {
              echo "PKG_CONFIG_LIBDIR=$pc"
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-Wl,-rpath-link,$stage/usr/lib/aarch64-linux-gnu"
            } >> "$GITHUB_ENV"
          fi

      - name: Point cargo at it
        if: matrix.linker_var != ''
        shell: bash
        run: echo "${{ matrix.linker_var }}=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/linkr-tui -> target
          key: ${{ matrix.target }}

      # The layout of the archive is decided in one place, by the script, and
      # the workflow only calls it — the same call a developer makes by hand.
      # Both faces of the program are packaged: the interface and the CLI.
      - name: Build and package
        shell: bash
        run: |
          dev/package.sh "${{ matrix.target }}"
          dev/package.sh --cli "${{ matrix.target }}"

      - name: Check the archives
        shell: bash
        run: |
          set -euo pipefail
          for archive in dist/*.tar.gz; do
            echo "archive: $archive"
            listing=$(tar -tzf "$archive")
            echo "$listing"
            name=$(basename "$archive" .tar.gz)
            bin=linkr
            case "$name" in linkr-cli-*) bin=linkr-cli ;; esac
            # Nothing may be in here that the script did not put there: a stray
            # file in a release is uploaded before anyone reads the diff.
            allowed=$(printf '%s\n' "$name/" "$name/$bin" "$name/$bin.exe" \
                                    "$name/README.md" "$name/LICENSE")
            for entry in $listing; do
              echo "$allowed" | grep -qx "$entry" || {
                echo "unexpected entry in the archive: $entry" >&2
                exit 1
              }
            done
            # And one of them must be the binary itself.
            echo "$listing" | grep -qE "^$name/$bin(\.exe)?$" || {
              echo "the archive holds no binary" >&2
              exit 1
            }
          done

      # Only the host's own target can be executed here. The rest are checked by
      # the fact that they linked, which is the most this runner can say.
      - name: Run the packaged binaries
        if: matrix.native
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/smoke && mkdir -p /tmp/smoke
          for archive in dist/*.tar.gz; do
            stem=$(basename "$archive" .tar.gz)
            dir=/tmp/smoke/$stem
            mkdir -p "$dir"
            tar -xzf "$archive" -C "$dir"
            bin=linkr
            case "$stem" in linkr-cli-*) bin=linkr-cli ;; esac
            found=$(find "$dir" -type f \( -name "$bin" -o -name "$bin.exe" \) | head -1)
            echo "running $found"
            "$found" --version
            if [ "$bin" = linkr-cli ]; then
              # The CLI build runs a command over the built-in loopback: the
              # exec path is what an agent harness calls, so it is what the
              # archive proves before it is uploaded.
              "$found" --bridge - --no-terminal --exec "echo hi" --quiet > /dev/null
              # Run bare it has no interface to open, and must say so rather
              # than exiting with silence.
              status=0
              "$found" </dev/null > /dev/null 2>&1 || status=$?
              [ "$status" -eq 2 ] || {
                echo "expected exit 2 from a bare CLI run, got $status" >&2
                exit 1
              }
            else
              # The paint path, through the same renderer the TUI uses.
              "$found" --print-frame 80x24 --lang en --sample > /dev/null
            fi
            # A dial that cannot open must fail loudly rather than start a broken
            # session — this is the exit code the tool documents. (`|| status=$?`
            # rather than `if`: the subject is the *exit code*, and an `if` whose
            # condition is false has a status of its own.)
            status=0
            "$found" --bridge /no/such/program > /dev/null 2>&1 || status=$?
            [ "$status" -eq 2 ] || { echo "expected exit 2, got $status" >&2; exit 1; }
          done

      - name: Upload the archives
        uses: actions/upload-artifact@v4
        with:
          name: linkr-tui-${{ matrix.target }}
          path: tools/linkr-tui/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Attach the archives to the release
    if: startsWith(github.ref, 'refs/tags/linkr-tui-v')
    needs: [targets, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The one job that writes anything: a release upload.
      contents: write
    env:
      # No checkout in this job, so `gh` cannot read the repository out of a
      # local git — "fatal: not a git repository" is that missing answer.
      # Every `gh` call below is about this workflow's own repository.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Collect the archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: .
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release if it is not there yet
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --title "linkr-tui $GITHUB_REF_NAME" --generate-notes

      # `--clobber` so re-running a workflow over an existing tag replaces the
      # archives rather than failing halfway.
      - name: Upload the archives and the checksums
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --clobber
