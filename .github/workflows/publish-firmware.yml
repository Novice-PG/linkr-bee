name: Publish firmware assets

# Repair or refresh only the firmware ZIPs of an existing release from a
# completed firmware build. The full release workflow also builds the desktop
# matrix; this job exists so a transient packaging failure cannot leave the
# release pointing at stale firmware.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build and test run id that produced the firmware artifacts
        required: true
      tag:
        description: Existing release tag to update
        required: true
        default: v0.1.4
      pattern:
        description: Artifact name pattern to republish
        required: true
        default: linkr-bee-esp32*

permissions:
  contents: write
  actions: write

jobs:
  publish:
    name: Package and upload firmware
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.pattern }}
          path: artifacts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Assemble the release ZIPs
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          mkdir -p release
          for dir in artifacts/*; do
            [ -d "${dir}" ] || continue
            slug="${dir##*/linkr-bee-}"
            root="linkr-bee-${tag}-firmware-${slug}"
            stage="release/${root}"
            mkdir -p "${stage}"
            cp -a "${dir}/." "${stage}/"
            (cd release && zip -qr "${root}.zip" "${root}")
          done
          ls -lh release

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: release/*.zip
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Refresh the flasher Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${GITHUB_REPOSITORY}" --ref main
