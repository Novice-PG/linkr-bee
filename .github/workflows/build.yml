name: Build and test

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install everything the host tests need before they run:
      #  * libdbus-1-dev, because tests/test_terminal_cli_c.py builds the shipped
      #    C reference client with -Werror, and skips itself without it;
      #  * fish and zsh, because the completion tests check the generated scripts
      #    with the real shells, and skip themselves where those are absent.
      - name: Install the test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y libdbus-1-dev pkg-config fish zsh
      - run: python3 -m unittest discover -s tests -v
      - name: Build the C reference terminal
        run: make -C tools clean all
      - name: Check the helper scripts
        run: |
          set -euo pipefail
          python3 -m compileall -q tools/linkr_ble_terminal.py
          sh -n tools/serve_web.sh
          sh -n tools/build_agent_bundle.sh
          sh -n tools/flash_firmware.sh
          sh -n tools/build_terminal_binary.sh
          sh -n tools/build_terminal.sh
          sh -n tools/verify.sh
          python3 -m compileall -q tools/build_terminal_bundle.py
          node --check tools/extract_macaron_cursors.mjs

  mobile:
    name: Web and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run bridge tests
        run: npm test

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Run terminal browser regressions
        run: npm run test:browser

      - name: Build Android and iOS web assets
        run: npm run build

      - name: Build HarmonyOS web assets
        run: npm run build:harmony

  terminal:
    name: Terminal (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The six platforms that were actually exercised end to end:
          # Windows x64 + x86, Linux x86_64 + i686 + arm64 + armv7. macOS is
          # left out on purpose — nothing in this repo has ever run on one, and
          # shipping a binary nobody has tested is a promise we cannot keep.
          # Native triples are spelled out so the packaging step never has to
          # guess where cargo put the binary.
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-i686
            os: ubuntu-latest
            target: i686-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: linux-armv7
            os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-i686
            os: windows-latest
            target: i686-pc-windows-msvc

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # btleplug talks to BlueZ over libdbus, so the Linux runners need the
      # development package before anything can link. The host package is what
      # `cargo test` builds against; the cross packages are what the release
      # binary links against, and the matching libc is what lets the smoke test
      # actually execute a foreign binary (armv7 additionally needs qemu's
      # binfmt handler, since that runner is x86_64).
      - name: Install the Linux system libraries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y libdbus-1-dev pkg-config
          case "${{ matrix.target }}" in
            i686-unknown-linux-gnu)
              sudo dpkg --add-architecture i386
              sudo apt-get update -y
              sudo apt-get install -y gcc-i686-linux-gnu libdbus-1-dev:i386 libc6:i386
              ;;
            armv7-unknown-linux-gnueabihf)
              sudo dpkg --add-architecture armhf
              sudo apt-get update -y
              sudo apt-get install -y gcc-arm-linux-gnueabihf libdbus-1-dev:armhf libc6:armhf qemu-user-static
              ;;
          esac

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/linkr-cli

      - name: Run the test suite
        shell: bash
        run: |
          set -euo pipefail
          cd tools/linkr-cli
          cargo test

      - name: Lint the crate
        if: matrix.name == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          cd tools/linkr-cli
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Build the release binary
        shell: bash
        run: |
          set -euo pipefail
          cd tools/linkr-cli
          # A cross build must see the *target's* dbus, not the runner's, and
          # must be told which linker speaks the target ABI. Without this the
          # pkg-config probe resolves the host's libdbus and the link fails
          # (or, worse, silently picks up the wrong architecture).
          case "${{ matrix.target }}" in
            i686-unknown-linux-gnu)
              export PKG_CONFIG_ALLOW_CROSS=1
              export PKG_CONFIG_SYSROOT_DIR=/
              export PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
              export CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=i686-linux-gnu-gcc
              ;;
            armv7-unknown-linux-gnueabihf)
              export PKG_CONFIG_ALLOW_CROSS=1
              export PKG_CONFIG_SYSROOT_DIR=/
              export PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
              export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc
              ;;
          esac
          cargo build --release --target "${{ matrix.target }}"

      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin="tools/linkr-cli/target/${{ matrix.target }}/release/linkr.exe"
          else
            bin="tools/linkr-cli/target/${{ matrix.target }}/release/linkr"
          fi
          test -n "$("${bin}" --version)"
          "${bin}" --help >/dev/null
          "${bin}" completion bash | bash -n
          "${bin}" --print-completion zsh >/dev/null

      - name: Package the binary
        shell: bash
        run: |
          set -euo pipefail
          out="dist/linkr-terminal-${{ matrix.name }}"
          mkdir -p "${out}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin="tools/linkr-cli/target/${{ matrix.target }}/release/linkr.exe"
          else
            bin="tools/linkr-cli/target/${{ matrix.target }}/release/linkr"
          fi
          cp "${bin}" "${out}/"
          name="$(basename "${bin}")"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "${out}" && sha256sum "${name}" > SHA256SUMS)
          else
            (cd "${out}" && shasum -a 256 "${name}" > SHA256SUMS)
          fi
          cat "${out}/SHA256SUMS"

      # One bundle per run: `linkr-bee-terminal-bundle` is a fixed artifact
      # name, so a second Windows target would collide on upload. The 32-bit
      # build ships as its own zip like every other platform, which is what
      # the release stages anyway.
      - name: Generate the self-extracting Windows bundle
        if: matrix.name == 'windows-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          exe="dist/linkr-terminal-${{ matrix.name }}/linkr.exe"
          version="$("${exe}" --version | awk '{print $2}')"
          python tools/build_terminal_bundle.py \
            --exe "${exe}" \
            --output dist/linkr-bee-terminal.ps1 \
            --version "${version}"

      - name: Upload the terminal
        uses: actions/upload-artifact@v4
        with:
          name: linkr-bee-terminal-${{ matrix.name }}
          path: dist/linkr-terminal-${{ matrix.name }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload the self-extracting Windows bundle
        if: matrix.name == 'windows-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: linkr-bee-terminal-bundle
          path: dist/linkr-bee-terminal.ps1
          if-no-files-found: error
          retention-days: 30

  firmware:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP32-C3 Super Mini
            board: esp32c3_supermini
            slug: esp32c3-supermini
            chip: esp32c3
            toolchain: riscv64-zephyr-elf
            flash_address: "0x0"
            factory_reset: GPIO0 to GND for two seconds during boot
          - name: ESP32-C3 DevKitM
            board: esp32c3_devkitm
            slug: esp32c3-devkitm
            chip: esp32c3
            toolchain: riscv64-zephyr-elf
            flash_address: "0x0"
            factory_reset: GPIO0 to GND for two seconds during boot
          - name: ESP32-C3 DevKitC
            board: esp32c3_devkitc
            slug: esp32c3-devkitc
            chip: esp32c3
            toolchain: riscv64-zephyr-elf
            flash_address: "0x0"
            factory_reset: GPIO0 to GND for two seconds during boot
          - name: ESP32-C5 DevKitC
            board: esp32c5_devkitc/esp32c5/hpcore
            slug: esp32c5-devkitc
            chip: esp32c5
            toolchain: riscv64-zephyr-elf
            flash_address: "0x2000"
            factory_reset: GPIO28 BOOT to GND for two seconds during boot
          - name: ESP32-WROOM-32 DevKitC
            board: esp32_devkitc/esp32/procpu
            slug: esp32-wroom-32
            chip: esp32
            toolchain: xtensa-espressif_esp32_zephyr-elf
            flash_address: "0x1000"
            factory_reset: GPIO27 to GND via external jumper

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build device-tree-compiler

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          sdk-version: 1.0.1
          toolchains: ${{ matrix.toolchain }}
          enable-ccache: false

      - name: Fetch Espressif firmware blobs
        shell: bash
        run: |
          set -euo pipefail
          # raw.githubusercontent.com intermittently answers 5xx; one miss used
          # to fail the whole firmware job, so retry before giving up.
          for attempt in 1 2 3; do
            if west blobs fetch hal_espressif; then
              exit 0
            fi
            echo "blob fetch attempt ${attempt} failed; retrying in 20s" >&2
            sleep 20
          done
          echo "blob fetch failed after 3 attempts" >&2
          exit 1

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          west build -p always -b "${{ matrix.board }}" \
            -d "${GITHUB_WORKSPACE}/app/build" "${GITHUB_WORKSPACE}/app"

      - name: Verify default feature set
        shell: bash
        run: |
          set -euo pipefail
          config="${GITHUB_WORKSPACE}/app/build/zephyr/.config"
          grep -qx 'CONFIG_LINKR_BLE_BRIDGE_WIFI=y' "${config}"
          grep -qx 'CONFIG_LINKR_BLE_BRIDGE_WIFI_OPERATION_TIMEOUT_MS=30000' "${config}"
          if grep -qx 'CONFIG_SOC_SERIES_ESP32=y' "${config}"; then
            grep -qx '# CONFIG_LINKR_BLE_BRIDGE_WEBDAV is not set' "${config}"
          else
            grep -qx 'CONFIG_LINKR_BLE_BRIDGE_WEBDAV=y' "${config}"
          fi
          grep -qx 'CONFIG_LINKR_BLE_BRIDGE_WS_BRIDGE=y' "${config}"
          grep -qx 'CONFIG_LINKR_BLE_BRIDGE_UART_RX_DROP_NO_CONN=y' "${config}"
          grep -qx 'CONFIG_WIFI=y' "${config}"
          grep -qx 'CONFIG_NETWORKING=y' "${config}"
          grep -qx 'CONFIG_NET_TCP=y' "${config}"
          grep -qx '# CONFIG_NET_IPV6 is not set' "${config}"
          grep -qx 'CONFIG_HTTP_SERVER=y' "${config}"
          grep -qx 'CONFIG_HTTP_SERVER_VERSION_1=y' "${config}"
          grep -qx '# CONFIG_HTTP_SERVER_VERSION_2 is not set' "${config}"
          grep -qx 'CONFIG_HTTP_SERVER_WEBSOCKET=y' "${config}"
          grep -qx 'CONFIG_ZVFS_EVENTFD_MAX=2' "${config}"
          grep -qx 'CONFIG_BT=y' "${config}"
          grep -qx 'CONFIG_BT_SMP=y' "${config}"
          grep -qx 'CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y' "${config}"
          grep -qx 'CONFIG_BT_BONDING_REQUIRED=y' "${config}"
          grep -qx 'CONFIG_BT_SETTINGS=y' "${config}"
          grep -qx 'CONFIG_BT_SMP_SC_PAIR_ONLY=y' "${config}"
          grep -qx 'CONFIG_BT_MAX_PAIRED=8' "${config}"
          grep -qx '# CONFIG_BT_KEYS_OVERWRITE_OLDEST is not set' "${config}"
          grep -qx '# CONFIG_BT_ZEPHYR_NUS_DEFAULT_INSTANCE is not set' "${config}"
          grep -qx 'CONFIG_BUILD_OUTPUT_BIN=y' "${config}"
          # Controller-side pairing support differs per Espressif generation:
          # C3 uses the legacy ESP32_BT_CTLR_* menu, C5 the newer
          # ESP32_BT_LE_* menu. Without these the controller has no Security
          # Manager while every Linkr GATT attribute requires encryption.
          if grep -qx 'CONFIG_SOC_SERIES_ESP32C3=y' "${config}"; then
            grep -qx 'CONFIG_ESP32_BT_CTLR_LE_SECURITY_ENABLE=y' "${config}"
          fi
          if grep -qx 'CONFIG_SOC_SERIES_ESP32C5=y' "${config}"; then
            grep -qx 'CONFIG_ESP32_BT_LE_SECURITY_ENABLE=y' "${config}"
            grep -qx 'CONFIG_ESP32_BT_LE_SM_SC=y' "${config}"
            grep -qx '# CONFIG_ESP32_BT_LE_SM_LEGACY is not set' "${config}"
            grep -qx 'CONFIG_ESP32_BT_LE_LL_CFG_FEAT_LE_ENCRYPTION=y' "${config}"
            grep -qx 'CONFIG_ESP32_BT_LE_CRYPTO_STACK_MBEDTLS=y' "${config}"
          fi
          if grep -qx 'CONFIG_SOC_SERIES_ESP32=y' "${config}"; then
            grep -qx 'CONFIG_ESP32_BT_CTLR_LE_SECURITY_ENABLE=y' "${config}"
          fi

      - name: Package firmware
        shell: bash
        run: |
          set -euo pipefail
          output="${GITHUB_WORKSPACE}/app/dist"
          zephyr="${GITHUB_WORKSPACE}/app/build/zephyr"
          rm -rf "${output}"
          mkdir -p "${output}"

          cp "${zephyr}/zephyr.bin" \
            "${output}/linkr-bee-${{ matrix.slug }}.bin"
          cp "${zephyr}/zephyr.elf" \
            "${output}/linkr-bee-${{ matrix.slug }}.elf"
          cp "${zephyr}/zephyr.map" \
            "${output}/linkr-bee-${{ matrix.slug }}.map"
          cp "${zephyr}/.config" "${output}/firmware.config"
          cp "${zephyr}/runners.yaml" "${output}/runners.yaml"
          cp "${GITHUB_WORKSPACE}/app/tools/flash_firmware.sh" \
            "${output}/flash_firmware.sh"
          chmod +x "${output}/flash_firmware.sh"

          cd "${output}"
          sha256sum "linkr-bee-${{ matrix.slug }}.bin" > SHA256SUMS
          version="$(sed -n 's/^CONFIG_LINKR_BLE_BRIDGE_FIRMWARE_VERSION=\"\([^\"]*\)\"$/\1/p' firmware.config)"
          test -n "${version}"
          cat > firmware.json <<EOF
          {
            "project": "linkr-bee",
            "version": "${version}",
            "board": "${{ matrix.board }}",
            "chip": "${{ matrix.chip }}",
            "flash_address": "${{ matrix.flash_address }}",
            "image": "linkr-bee-${{ matrix.slug }}.bin",
            "git_commit": "${GITHUB_SHA}"
          }
          EOF
          cat > FLASHING.txt <<'EOF'
          macOS / Linux:
            ./flash_firmware.sh --image linkr-bee-${{ matrix.slug }}.bin

          Select a port explicitly when more than one device is connected:
            ./flash_firmware.sh --image linkr-bee-${{ matrix.slug }}.bin --port /dev/cu.usbmodemXXXX

          The script preserves the settings partition.
          Factory reset: ${{ matrix.factory_reset }}.
          EOF

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: linkr-bee-${{ matrix.slug }}
          path: app/dist/
          if-no-files-found: error
          retention-days: 30

  # E3-A: a `v*` tag publishes everything this run just built as a GitHub
  # Release. Artifacts alone never worked as a download link: they live on the
  # run, expire after 30 days, and never appear on the Releases page — so the
  # tutorial had nowhere stable to point at.
  #
  # Every terminal archive unpacks to `linkr-terminal-<slug>/`, the same folder
  # `tools/build_terminal.sh` produces locally, so the check is identical
  # whichever way the file was obtained:
  #
  #     tar xzf linkr-terminal-linux-aarch64.tar.gz
  #     cd linkr-terminal-linux-aarch64 && sha256sum -c SHA256SUMS
  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host, terminal, firmware]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the only job that creates the Release
    steps:
      - name: Download every artifact of this run
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: linkr-bee-*
          merge-multiple: false

      - name: Stage the release files
        run: |
          set -euo pipefail
          mkdir -p release

          # One archive per terminal platform. Windows gets a .zip: Explorer
          # opens it natively (a tar.gz would need 7-Zip), and the zip is the
          # path that does not trip antivirus — the self-extracting ps1 is read
          # as a dropper (BACKLOG I1), so it ships as a secondary download.
          for dir in artifacts/linkr-bee-terminal-*/; do
            [ -d "${dir}" ] || continue
            base="$(basename "${dir}")"
            [ "${base}" = "linkr-bee-terminal-bundle" ] && continue
            slug="${base#linkr-bee-terminal-}"
            mkdir -p "release/linkr-terminal-${slug}"
            cp -a "${dir}." "release/linkr-terminal-${slug}/"
            case "${slug}" in
              *windows*)
                python3 -c "import sys,zipfile,pathlib; s=sys.argv[1]; r=pathlib.Path('release')/f'linkr-terminal-{s}'; z=zipfile.ZipFile(pathlib.Path('release')/f'linkr-terminal-{s}.zip','w',zipfile.ZIP_DEFLATED,compresslevel=9); [z.write(p,f'linkr-terminal-{s}/'+str(p.relative_to(r))) for p in sorted(r.rglob('*')) if p.is_file()]; z.close()" "${slug}"
                ;;
              *)
                tar -C release -czf "release/linkr-terminal-${slug}.tar.gz" "linkr-terminal-${slug}"
                ;;
            esac
            rm -rf "release/linkr-terminal-${slug}"
          done

          # The self-extracting Windows bundle verifies its own payload, so it
          # ships as the single file it is.
          if [ -f artifacts/linkr-bee-terminal-bundle/linkr-bee-terminal.ps1 ]; then
            cp artifacts/linkr-bee-terminal-bundle/linkr-bee-terminal.ps1 release/
          fi

          # Firmware: one archive per board, flashing notes and script inside.
          for dir in artifacts/linkr-bee-*/; do
            [ -d "${dir}" ] || continue
            base="$(basename "${dir}")"
            case "${base}" in linkr-bee-terminal-*) continue ;; esac
            tar -C artifacts -czf "release/${base}.tar.gz" "${base}"
          done

          # One checksum file covering the whole release, including the
          # per-archive SHA256SUMS each directory already carries.
          (cd release && find . -type f ! -path './SHA256SUMS' -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat release/SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Linkr Bee ${GITHUB_REF_NAME}" \
            --generate-notes
          find release -type f -print0 \
            | xargs -0 -n 20 gh release upload "${GITHUB_REF_NAME}" \
                --repo "${GITHUB_REPOSITORY}" --clobber
